name: CI

on:
  push:
    branches: [main, v2, fix/LAT-386-crash-atomicity]
    tags: ["v*"]
  pull_request:
    branches: [main, v2]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.ref != 'refs/heads/fix/LAT-386-crash-atomicity'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --extra dev --extra server
      - name: Lint
        run: uv run ruff check src/ tests/
      - name: Format check
        run: uv run ruff format --check src/ tests/

  test:
    if: github.ref != 'refs/heads/fix/LAT-386-crash-atomicity'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev --extra server --python ${{ matrix.python-version }}
      - name: Smoke the installed CLI
        run: uv run python -c "import sys; print(sys.version)" && uv run lattice --version
      - name: Test
        run: uv run pytest -x -q

  type-check:
    if: github.ref != 'refs/heads/fix/LAT-386-crash-atomicity'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true  # advisory until codebase is fully typed
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --extra dev --extra server
      - name: Type check
        run: uv run mypy src/lattice/

  publish:
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Build
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Temporary LAT-386 baseline/after stress gate; remove before PR review.
  lat386-stress:
    if: github.ref == 'refs/heads/fix/LAT-386-crash-atomicity'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Check out pre-fix baseline
        uses: actions/checkout@v4
        with:
          ref: 76cdeaef56c57063c7635684f571b0b5c06120ad
          path: lat386-baseline
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev --extra server --python ${{ matrix.python-version }}
      - name: Install baseline dependencies
        working-directory: lat386-baseline
        run: uv sync --extra dev --extra server --python ${{ matrix.python-version }}
      - name: Install temporary repeat plugin in baseline
        working-directory: lat386-baseline
        run: uv pip install --python .venv/bin/python pytest-repeat
      - name: Install temporary repeat plugin in fixed checkout
        run: uv pip install --python .venv/bin/python pytest-repeat
      - name: Prove pre-fix failure 500 times under CPU load
        working-directory: lat386-baseline
        run: |
          yes > /dev/null &
          stress_pid=$!
          trap 'kill "$stress_pid" 2>/dev/null || true' EXIT
          set +e
          uv run --no-sync pytest --count=500 -k "task.status or task.unarchive" -q --tb=no \
            --junitxml=/tmp/lat386-before.xml \
            tests/test_server/test_transactions.py::test_every_boundary_leaves_the_operation_wholly_present_or_absent \
            > /tmp/lat386-before.log 2>&1
          test_status=$?
          set -e
          tail -n 6 /tmp/lat386-before.log
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          counts = {"task.status": [0, 0], "task.unarchive": [0, 0]}
          for case in ET.parse("/tmp/lat386-before.xml").iter("testcase"):
              name = case.get("name", "")
              for scenario, result in counts.items():
                  if scenario in name:
                      result[1] += 1
                      if case.find("failure") is not None or case.find("error") is not None:
                          result[0] += 1
          for scenario, (failed, total) in counts.items():
              print(f"{scenario}: {failed}/{total} failed")
              if (failed, total) != (500, 500):
                  sys.exit(f"expected 500/500 pre-fix failures for {scenario}")
          PY
          if [ "$test_status" -eq 0 ]; then
            echo "pre-fix fault walk unexpectedly passed" >&2
            exit 1
          fi
      - name: Prove fixed fault walks 500 times under CPU load
        run: |
          yes > /dev/null &
          stress_pid=$!
          trap 'kill "$stress_pid" 2>/dev/null || true' EXIT
          set +e
          uv run --no-sync pytest --count=500 -k "task.status or task.unarchive" -q --tb=no \
            --junitxml=/tmp/lat386-after.xml \
            tests/test_server/test_transactions.py::test_every_boundary_leaves_the_operation_wholly_present_or_absent \
            > /tmp/lat386-after.log 2>&1
          test_status=$?
          set -e
          tail -n 6 /tmp/lat386-after.log
          if [ "$test_status" -ne 0 ]; then
            echo "fixed fault walk failed with exit $test_status" >&2
            exit "$test_status"
          fi
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          counts = {"task.status": [0, 0], "task.unarchive": [0, 0]}
          for case in ET.parse("/tmp/lat386-after.xml").iter("testcase"):
              name = case.get("name", "")
              for scenario, result in counts.items():
                  if scenario in name:
                      result[1] += 1
                      if case.find("failure") is not None or case.find("error") is not None:
                          result[0] += 1
          for scenario, (failed, total) in counts.items():
              print(f"{scenario}: {failed}/{total} failed")
              if (failed, total) != (0, 500):
                  sys.exit(f"expected 0/500 post-fix failures for {scenario}")
          PY
