<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Issues (Take A: Inbox)</title>
<link rel="stylesheet" href="shared/shell.css">
<style>
/* Take A: Inbox, round 2. A viewer, not a place to decide: a quiet queue on the left, the selected issue
   on the right with its photos and video inline. Decisions are made by telling an agent, so the ID is
   prominent and one click copies it. Fixed sizes below exist so nothing moves while reading. */
:root{
  --qw:clamp(25rem,24vw,34rem);
  --row-h:4.5rem;
  --proto:#C084FC;--proto-bg:#3B0764;--proto-text:#F3E8FF;
}
body{overflow:hidden}
.inbox{display:grid;grid-template-columns:var(--qw) 1fr;height:calc(100vh - 3rem - var(--proto-bar-h));min-width:0}

/* ---------- left: the queue ---------- */
.q-pane{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border);background:var(--surface-card)}
.q-tabs{display:grid;grid-template-columns:1.45fr 1.3fr 1fr .85fr;gap:.375rem;padding:.75rem .75rem;border-bottom:1px solid var(--border-subtle)}
.q-tab{position:relative;height:3.25rem;text-align:left;padding:.3rem .55rem;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--text-secondary);cursor:pointer;font-size:.7rem;line-height:1.2;overflow:hidden}
.q-tab:hover{background:var(--surface-hover)}
.q-tab .q-tab-label{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-tab .q-tab-count{display:block;font-size:1.2rem;font-weight:700;color:var(--text-primary);margin-top:.1rem}
.q-tab kbd{position:absolute;bottom:.35rem;right:.35rem;font-size:.62rem;min-width:1rem;padding:0 .2rem;line-height:1.3}
.q-tab[aria-pressed=true]{border-color:var(--accent-primary);background:var(--surface-raised);color:var(--text-primary);box-shadow:inset 0 -2px 0 var(--accent-primary)}
.q-tab[data-q=open] .q-tab-count{color:var(--st-open)}

.q-list{flex:1;overflow-y:auto;min-height:0}
.q-row{display:flex;gap:.625rem;height:var(--row-h);padding:.5rem .75rem;border-bottom:1px solid var(--border-row);border-left:3px solid transparent;cursor:pointer}
.q-row:hover{background:var(--surface-hover)}
.q-row.cursor{background:var(--surface-raised);border-left-color:var(--accent-primary)}
.q-main{flex:1;min-width:0}
.q-top{display:flex;align-items:center;gap:.5rem;font-size:.78rem;height:1.3rem}
.q-top .iid{font-size:.82rem;width:5.25rem;flex-shrink:0}
.q-tag{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-muted)}
.q-age{flex-shrink:0;width:4.25rem;text-align:right;color:var(--text-muted)}
.q-text{font-size:.9rem;line-height:1.35;color:var(--text-secondary);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:.1rem}
.q-row.cursor .q-text{color:var(--text-primary)}
/* The thumbnail slot is reserved on every row, at the right, so text always starts at the same x and a
   row never reflows when media arrives. Empty, it is invisible: ragged-right text hides it. */
.q-thumb{position:relative;flex:0 0 5rem;height:3.25rem;align-self:center;border-radius:var(--radius-sm);overflow:hidden;background:#0A0A0A;border:1px solid var(--border)}
.q-thumb.none{background:transparent;border-color:transparent}
.q-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.q-badge{position:absolute;font-size:.64rem;line-height:1;padding:.15rem .25rem;border-radius:2px;background:rgba(0,0,0,.78);color:#fff;font-weight:700}
.q-vid{left:.2rem;bottom:.2rem}
.q-count{right:.2rem;top:.2rem;background:var(--accent-primary)}
.q-empty{padding:2.5rem 1.25rem;color:var(--text-muted);font-size:.9rem;line-height:1.6}
.q-foot{height:2rem;display:flex;align-items:center;gap:.4rem;padding:0 .875rem;border-top:1px solid var(--border-subtle);font-size:.74rem;color:var(--text-muted);white-space:nowrap;overflow:hidden}
.q-foot .sep{width:.5rem}

/* ---------- right: the issue ---------- */
.d-pane{display:flex;flex-direction:column;min-width:0;min-height:0}
.d-head{height:3rem;flex-shrink:0;display:flex;align-items:center;gap:.75rem;padding:0 2rem;border-bottom:1px solid var(--border-subtle);font-size:.8rem;color:var(--text-muted);white-space:nowrap}
.id-copy{font-family:var(--font-mono);font-size:1.15rem;font-weight:700;color:var(--text-primary);background:transparent;border:1px solid transparent;border-radius:var(--radius-sm);
  padding:.05rem .35rem;margin-left:-.35rem;cursor:copy;width:6.75rem;height:2rem;text-align:left;flex-shrink:0}
.id-copy:hover{border-color:var(--border);background:var(--surface-hover)}
.copy-status{width:4.25rem;height:1.2rem;line-height:1.2rem;flex-shrink:0;font-size:.74rem;color:var(--text-muted)}
.copy-status.done{color:var(--accent-primary);font-weight:700}
.d-facts{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.d-facts .actor{font-size:.7rem}

.d-body{position:relative;flex:1;overflow-y:auto;min-height:0;padding:1.5rem 2rem 3rem}
.d-title{max-width:62rem;font-size:1.4rem;line-height:1.4;font-weight:700;color:var(--text-primary);word-break:break-word;margin:0 0 .75rem}
.d-desc{max-width:52rem;font-size:1rem;line-height:1.65;color:#CFCFCF;white-space:pre-wrap;word-break:break-word;margin:0 0 1.5rem}
.d-desc:empty{display:none}
#d-title + .d-desc:empty + #d-media{margin-top:1.25rem}

/* media inline, in the reading flow; each item at its own size up to the pane width, never upscaled */
.m-item{margin:0 0 1.75rem}
.m-frame{display:block;background:#050505;border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;max-width:100%}
.m-frame img,.m-frame video{display:block;width:100%;height:100%;object-fit:contain}
.m-frame.photo{cursor:zoom-in}
.m-frame.video{position:relative;cursor:pointer}
.m-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:4.5rem;height:4.5rem;border-radius:50%;border:2px solid rgba(255,255,255,.85);
  background:rgba(0,0,0,.6);color:#fff;font-size:1.6rem;line-height:1;cursor:pointer;padding:0 0 0 .3rem}
.m-play:hover{background:var(--accent-primary);border-color:var(--accent-primary)}
.m-frame.playing .m-play{display:none}
.af{margin-top:.5rem}
.af-label{font-size:.74rem;color:var(--text-muted);margin-bottom:.3rem}
.af-row{display:flex;gap:.375rem}
.af-f{display:flex;flex-direction:column;width:7rem;padding:0;background:#050505;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;overflow:hidden;color:var(--text-muted)}
.af-f img{width:100%;height:4.4rem;object-fit:contain;display:block;opacity:.85}
.af-f span{font-size:.7rem;padding:.1rem 0;text-align:center}
.af-f:hover img,.af-f.on img{opacity:1}
.af-f.on{border-color:var(--accent-primary)}
.af-f.on span{color:var(--text-primary)}
.af-none{height:5.6rem;display:flex;align-items:center;padding:0 .875rem;border:1px dashed var(--border);border-radius:var(--radius-sm);color:var(--text-muted);font-size:.8rem;width:36.5rem;max-width:100%}

.outcome{max-width:62rem;margin:0 0 1.25rem}
.story{display:flex;align-items:center;gap:.75rem;padding:.45rem 0;border-top:1px solid var(--border-row);font-size:.9rem}
.story:last-of-type{border-bottom:1px solid var(--border-row)}
.story .tid{width:5.25rem}
.story .s-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story.dead .s-title{color:var(--text-muted)}
.proto-ctl{display:inline-flex;align-items:center;gap:.4rem;flex-shrink:0;background:var(--proto-bg);border:1px dashed var(--proto);color:var(--proto-text);border-radius:var(--radius-sm);padding:.1rem .4rem;font-size:.7rem}
.proto-ctl select{background:#1E0333;color:var(--proto-text);border:1px solid var(--proto);border-radius:var(--radius-sm);font-family:inherit;font-size:.7rem;width:7.5rem}
.no-story{font-size:.88rem;color:var(--text-secondary);margin:.5rem 0 0}
.no-story code{font-family:var(--font-mono);color:var(--text-primary);background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 .3rem}
.closure{font-size:.9rem;color:var(--text-secondary)}
.closure b{color:var(--text-primary)}

.meta{max-width:62rem;font-size:.8rem;color:var(--text-muted);line-height:1.7;margin:0 0 1rem}
.meta .actor{font-size:.7rem}
.meta .evidence{display:inline;margin-left:.25rem}

/* comments: who said it is the point, so the author chip leads and the rule on the left says human or agent */
.comments{max-width:52rem;margin:1.5rem 0 1rem}
.c-head{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin:0 0 .5rem}
.cm{padding:.35rem 0 .35rem .75rem;border-left:2px solid var(--border);margin-bottom:.75rem}
.cm-human{border-left-color:var(--chip-human-border)}
.cm-agent{border-left-color:var(--chip-agent-border)}
.cm-meta{font-size:.75rem;color:var(--text-muted);display:flex;gap:.5rem;align-items:center}
.cm-body{font-size:.95rem;line-height:1.55;color:var(--text-primary);white-space:pre-wrap;word-break:break-word;margin-top:.2rem}
.cm-body .mention{color:var(--text-primary);font-weight:700}
.cm-body .iid,.cm-body .tid{font-weight:600}
.compose{max-width:52rem;display:flex;gap:.5rem;align-items:flex-start;margin:0 0 1.5rem}
.compose textarea{flex:1;min-width:0;height:2.1rem;resize:none;background:transparent;color:var(--text-primary);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);
  padding:.35rem .6rem;font-family:inherit;font-size:.9rem;line-height:1.4;transition:height .12s ease}
.compose textarea::placeholder{color:var(--text-muted)}
.compose textarea:focus{outline:none;height:5rem;border-color:var(--accent-primary);background:var(--bg-base)}
.compose .btn{width:4.5rem;height:2.1rem;color:var(--text-muted)}
.compose.active .btn{background:var(--accent-primary);border-color:var(--accent-primary);color:#fff;font-weight:600}
.q-com{flex-shrink:0;width:2.25rem;display:inline-flex;align-items:center;gap:.2rem;justify-content:flex-end;color:var(--text-muted);font-size:.72rem}
.q-com svg{width:.8rem;height:.8rem}

.hist-toggle{background:transparent;border:0;padding:0;color:var(--text-muted);font-family:inherit;font-size:.8rem;cursor:pointer}
.hist-toggle:hover{color:var(--text-primary)}
.hist-toggle .caret{display:inline-block;width:1rem}
.hist{max-width:62rem;font-size:.8rem;border-left:2px solid var(--border);padding-left:.875rem;margin:.5rem 0 0 .3rem}
.hist div{display:flex;gap:.75rem;padding:.2rem 0}
.hist .h-at{width:5.5rem;flex-shrink:0;color:var(--text-muted)}
.hist .h-what{flex:1;min-width:0;color:var(--text-secondary);word-break:break-word}

.quiet{max-width:34rem;margin:5rem auto 0;color:var(--text-muted);font-size:1rem;line-height:1.6;text-align:center}
.quiet h2{color:var(--st-resolved);font-size:1.4rem;margin:0 0 .5rem}

/* look closer: the current item as large as the window allows; the purple bar stays */
.closer{position:fixed;inset:0 0 var(--proto-bar-h) 0;z-index:35;background:#000;display:flex;flex-direction:column}
.closer-bar{flex-shrink:0;height:3rem;display:flex;align-items:center;gap:1rem;padding:0 1.25rem;background:rgba(23,23,23,.92);border-bottom:1px solid var(--border);font-size:.9rem}
.closer-bar .iid{font-size:1.05rem;width:6.5rem}
.closer-bar .cb-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-secondary)}
.closer-bar .cb-pos{width:5rem;text-align:right;color:var(--text-muted)}
.closer-bar .cb-keys{color:var(--text-muted);font-size:.8rem;white-space:nowrap}
.closer-media{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.closer-media img,.closer-media video{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;display:block}
#selftest{display:none}
</style>
</head>
<body>
<div class="inbox">
  <section class="q-pane" aria-label="Queue">
    <div class="q-tabs" id="q-tabs"></div>
    <div class="q-list" id="q-list" role="listbox" aria-label="Issues"></div>
    <div class="q-foot"><kbd>j</kbd><kbd>k</kbd> move<span class="sep"></span><kbd>c</kbd> copy ID<span class="sep"></span><kbd>f</kbd> look closer<span class="sep"></span><kbd>i</kbd> file</div>
  </section>
  <section class="d-pane" aria-label="Selected issue">
    <div class="d-head" id="d-head">
      <button class="id-copy" id="id-copy" title="Copy the ID (c), to tell an agent what to do with it"></button>
      <span class="copy-status" id="copy-status"></span>
      <span id="d-state"></span>
      <span class="d-facts" id="d-facts"></span>
    </div>
    <div class="d-body" id="d-body"></div>
  </section>
</div>
<pre id="selftest"></pre>

<script src="shared/mock-media.js"></script>
<script src="shared/mock-data.js"></script>
<script src="shared/store.js"></script>
<script src="shared/shell.js"></script>
<script>
(function () {
  "use strict";
  var S = window.IssueStore, F = Shell.fmt, esc = F.esc;

  Shell.mount({ active: "issues", page: "a", title: "Issues (Take A: Inbox)" });

  var QUEUES = [
    { key: "open", label: "No story", states: ["open"] },
    { key: "linked", label: "Has story", states: ["linked"] },
    { key: "resolved", label: "Resolved", states: ["resolved"] },
    { key: "closed", label: "Closed", states: ["dismissed", "duplicate"] }
  ];
  var EMPTY = {
    linked: "No issue has a story in progress.",
    resolved: "Nothing is resolved yet. An issue is resolved when every story linked to it is done.",
    closed: "Nothing has been dismissed or marked a duplicate."
  };

  // ---- UI state ----
  var view = "open";
  var cursorBy = { open: null, linked: null, resolved: null, closed: null }; // cursor id per queue
  var cursorIdx = { open: 0, linked: 0, resolved: 0, closed: 0 };
  var shownId = null;     // issue in the right pane, to keep or reset its scroll
  var mediaKey = null;    // what the media section shows; rebuilt only when this changes, so video keeps playing
  var focusIdx = 0;       // which item look closer opens: the last one clicked, else the first
  var closer = null;      // { idx, issue } while look closer is open
  var histOpen = false;   // history is collapsed until asked for; the choice holds while moving between issues

  function queueOf(issue) {
    var st = S.state(issue);
    for (var n = 0; n < QUEUES.length; n++) { if (QUEUES[n].states.indexOf(st) >= 0) { return QUEUES[n].key; } }
    return "open";
  }
  function listFor(key) { return S.issues().filter(function (i) { return queueOf(i) === key; }); } // oldest first
  function current() { var id = cursorBy[view]; return id ? S.get(id) : null; }
  function itemsOf(i) { return (i && i.media) || []; }

  // Keep the cursor on the same issue if it is still in this queue; otherwise take whatever now sits at its old position.
  function settleCursor(list) {
    var id = cursorBy[view], idx = -1;
    for (var n = 0; n < list.length; n++) { if (list[n].id === id) { idx = n; } }
    if (idx < 0) { idx = Math.min(cursorIdx[view], list.length - 1); }
    cursorIdx[view] = Math.max(0, idx);
    cursorBy[view] = list.length ? list[Math.max(0, idx)].id : null;
  }
  function move(delta) {
    var list = listFor(view); if (!list.length) { return; }
    var idx = Math.max(0, Math.min(list.length - 1, cursorIdx[view] + delta));
    cursorIdx[view] = idx; cursorBy[view] = list[idx].id;
    render();
  }
  function switchQueue(key) { if (view !== key) { view = key; render(); } }
  // Show an issue wherever it now lives (used when a story's status moves it, and by the ?at= hook).
  function goTo(id) {
    var i = S.get(id); if (!i) { return; }
    view = queueOf(i); cursorBy[view] = id;
    render();
  }

  // ---- copy the ID: the way to act on an issue is to tell an agent about it ----
  var copyTimer = null;
  function copyId() {
    var i = current(); if (!i) { return; }
    var st = document.getElementById("copy-status");
    function show(ok) {
      st.textContent = ok ? "Copied" : "Not copied";
      st.classList.toggle("done", ok);
      clearTimeout(copyTimer);
      copyTimer = setTimeout(function () { st.textContent = current() ? "copy" : ""; st.classList.remove("done"); }, 1600);
    }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = i.id; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      return ok;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(i.id).then(function () { show(true); }, function () { show(fallback()); });
    } else { show(fallback()); }
  }

  // ---- media inline ----
  function thumbSrc(m) { return m.kind === "video" ? m.poster : m.src; }
  function queueThumb(i) {
    var ms = itemsOf(i);
    if (!ms.length) { return '<span class="q-thumb none"></span>'; }
    var m = ms.filter(function (x) { return x.kind === "video"; })[0] || ms[0], src = thumbSrc(m);
    return '<span class="q-thumb" title="' + esc(F.mediaCount(ms)) + '">' +
      (src ? '<img loading="lazy" decoding="async" src="' + esc(src) + '" alt="">' : "") +
      (m.kind === "video" ? '<span class="q-badge q-vid">▶ ' + F.dur(m.duration) + "</span>" : "") +
      (ms.length > 1 ? '<span class="q-badge q-count">' + ms.length + "</span>" : "") + "</span>";
  }
  function frameAt(frames, t) { var n = -1; frames.forEach(function (f, k) { if (f.t <= t + 0.05) { n = k; } }); return n; }

  function renderMedia(i) {
    var box = document.getElementById("d-media"); if (!box) { return; }
    var ms = itemsOf(i), key = i.id + "|" + ms.map(function (m) { return m.id; }).join(",");
    if (key === mediaKey) { return; }
    mediaKey = key;
    focusIdx = 0;
    box.innerHTML = ms.map(function (m, k) {
      var frame = m.kind === "video"
        ? '<video src="' + esc(m.src) + '"' + (m.poster ? ' poster="' + esc(m.poster) + '"' : "") + ' muted playsinline preload="metadata" title="' + esc(m.name) + '"></video>' +
          '<button class="m-play" data-play="' + k + '" title="Play (muted)">▶</button>'
        : '<img src="' + esc(m.src) + '" alt="photo attached to ' + esc(i.id) + '" title="' + esc(m.name) + '">';
      var agent = "";
      if (m.kind === "video") {
        agent = '<div class="af">' + (m.frames && m.frames.length
          ? '<div class="af-label">What an agent sees: these frames, taken when it was filed. Click one to see that moment.</div><div class="af-row">' +
            m.frames.map(function (f, n) {
              return '<button class="af-f" data-frame="' + n + '" data-item="' + k + '"><img src="' + esc(f.src) + '" alt="frame at ' + F.dur(f.t, true) + '" loading="lazy"><span>' + F.dur(f.t, true) + "</span></button>";
            }).join("") + "</div>"
          : '<div class="af-none">Frames are made when this is filed.</div>') + "</div>";
      }
      return '<figure class="m-item" data-item="' + k + '"><div class="m-frame ' + m.kind + '" data-w="' + (m.w || 1280) + '" data-h="' + (m.h || 800) + '">' + frame + "</div>" + agent + "</figure>";
    }).join("");
    box.querySelectorAll("video").forEach(function (v) {
      var fig = v.closest(".m-item"), m = ms[+fig.getAttribute("data-item")];
      v.addEventListener("timeupdate", function () {
        var n = frameAt(m.frames || [], v.currentTime);
        fig.querySelectorAll(".af-f").forEach(function (f, k) { f.classList.toggle("on", k === n); });
      });
    });
    sizeMedia();
  }
  // Each item is shown at its own pixel size, shrunk only to fit the pane and 72% of the window height.
  // Sizes are set before the file loads, so nothing below jumps when it arrives.
  function sizeMedia() {
    var box = document.getElementById("d-media"); if (!box) { return; }
    var maxW = box.clientWidth - 2, maxH = Math.round(window.innerHeight * 0.72);
    box.querySelectorAll(".m-frame").forEach(function (f) {
      var w = +f.getAttribute("data-w"), h = +f.getAttribute("data-h");
      var s = Math.min(1, maxW / w, maxH / h);
      f.style.width = Math.round(w * s) + 2 + "px";
      f.style.height = Math.round(h * s) + 2 + "px";
    });
  }
  window.addEventListener("resize", sizeMedia);

  // Video is click to play: a poster and a play button until asked, then native controls.
  function playInline(itemIdx) {
    var fig = document.querySelector('.m-item[data-item="' + itemIdx + '"]'), v = fig && fig.querySelector("video");
    if (!v) { return; }
    v.controls = true;
    fig.querySelector(".m-frame").classList.add("playing");
    var p = v.play(); if (p && p.catch) { p.catch(function () {}); }
  }
  function seekFrame(itemIdx, frameIdx) {
    var fig = document.querySelector('.m-item[data-item="' + itemIdx + '"]'), v = fig && fig.querySelector("video");
    var m = itemsOf(current())[itemIdx]; if (!v || !m) { return; }
    v.pause();
    v.controls = true;
    fig.querySelector(".m-frame").classList.add("playing");
    v.currentTime = m.frames[frameIdx].t;
    fig.querySelectorAll(".af-f").forEach(function (f, k) { f.classList.toggle("on", k === frameIdx); });
    focusIdx = itemIdx;
  }

  // ---- look closer ----
  function openCloser(idx) {
    var i = current(), ms = itemsOf(i);
    if (!ms.length) { closeCloser(); return; }
    idx = Math.max(0, Math.min(ms.length - 1, idx || 0));
    var m = ms[idx], inline = document.querySelector('.m-item[data-item="' + idx + '"] video');
    var start = inline ? inline.currentTime : 0, wasPlaying = inline && !inline.paused;
    if (inline) { inline.pause(); }
    var el = document.getElementById("closer");
